name: daily-update

on:
  schedule:
    # after the US close (20:00/21:00 UTC); the second run is a backup if the first is late or Yahoo lags
    - cron: "30 22 * * 1-5"
    - cron: "15 1 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Update breadth data
        run: python scripts/update.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/membership.json site/data
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: $(python -c "import json;print(json.load(open('site/data/breadth.json'))['latest_date'])")"
            git pull --rebase
            git push
          fi
