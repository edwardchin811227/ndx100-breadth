name: daily-update

on:
  # The daily run now lives in the NAS container `ndx100-breadth`
  # (/volume2/yoliaccessories/ndx100-breadth-docker), which runs the same
  # scripts/update.py and pushes the same site/data files. The schedule is
  # intentionally removed so two runners cannot race for the same commit;
  # manual dispatch is kept as a fallback.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Update breadth data
        run: python scripts/update.py
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/membership.json site/data
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: $(python -c "import json;print(json.load(open('site/data/breadth.json'))['latest_date'])")"
            git pull --rebase
            git push
          fi
